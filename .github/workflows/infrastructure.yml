name: 🏗️ Reusable Infrastructure

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      action:
        required: true
        type: string
        default: 'apply'
      project_name:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1
  TF_VAR_environment: ${{ inputs.environment }}
  TF_VAR_project: ${{ inputs.project_name }}

permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: 🚀 ${{ inputs.action }} Infrastructure
    runs-on: ubuntu-latest
    
    outputs:
      eks_cluster_name: ${{ steps.outputs.outputs.eks_cluster_name }}
      alb_dns_name: ${{ steps.outputs.outputs.alb_dns_name }}
      ecr_repositories: ${{ steps.outputs.outputs.ecr_repositories }}
    
    steps:
    - name: 📥 Checkout ia-ops-iac
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/ia-ops-iac
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: ⚙️ Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: BillPayInfrastructure
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🔧 Setup Terragrunt
      uses: autero1/action-terragrunt@v1.3.2
      with:
        terragrunt_version: 0.87.5
        
    - name: 🔧 Setup OpenTofu
      uses: opentofu/setup-opentofu@v1
      with:
        tofu_version: 1.10.6
        
    - name: 📋 Terragrunt Plan
      if: inputs.action == 'plan'
      working-directory: ./environments/${{ inputs.environment }}
      run: terragrunt plan
      
    - name: 🚀 Terragrunt Apply
      if: inputs.action == 'apply'
      working-directory: ./environments/${{ inputs.environment }}
      run: terragrunt apply -auto-approve
      
    - name: 💥 Terragrunt Destroy
      if: inputs.action == 'destroy'
      working-directory: ./environments/${{ inputs.environment }}
      run: terragrunt destroy -auto-approve
      
    - name: 📤 Capture Outputs
      id: outputs
      if: inputs.action == 'apply'
      working-directory: ./environments/${{ inputs.environment }}
      run: |
        echo "eks_cluster_name=$(terragrunt output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
        echo "alb_dns_name=$(terragrunt output -raw alb_dns_name)" >> $GITHUB_OUTPUT
        echo "ecr_repositories=$(terragrunt output -json ecr_repositories)" >> $GITHUB_OUTPUT
