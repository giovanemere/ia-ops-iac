name: 🚀 Complete Project Deploy

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud Provider'
        required: true
        type: choice
        options: ['aws', 'gcp', 'azure', 'oci']
        default: 'aws'
      region:
        description: 'Region'
        required: true
        type: string
        default: 'us-east-1'
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: ['dev', 'staging', 'prod', 'demo']
        default: 'demo'
      project_name:
        description: 'Project Name'
        required: true
        type: string
        default: 'billpay'
      auth_method:
        description: 'Authentication Method'
        required: false
        type: choice
        options: ['oidc', 'legacy']
        default: 'oidc'
      infrastructure:
        description: 'Infrastructure: vpc,k8s,registry,storage,lb'
        required: false
        type: string
        default: 'true,true,true,true,true'
      applications:
        description: 'Applications: backend,frontend-a,frontend-b,feature-flags'
        required: false
        type: string
        default: 'true,true,false,false'
      kubernetes_type:
        description: 'Kubernetes Type'
        required: false
        type: choice
        options: ['eks', 'gke', 'aks', 'oke']
        default: 'eks'
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      project_name:
        required: true
        type: string
        default: 'billpay'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  auth-setup:
    name: 🔐 Setup Authentication
    runs-on: ubuntu-latest
    outputs:
      auth_configured: ${{ steps.auth.outputs.configured }}
    steps:
      - name: 🔐 Configure AWS Credentials (OIDC)
        if: ${{ inputs.auth_method == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: BillPayCompleteStack
          aws-region: ${{ inputs.region }}
          
      - name: 🔑 Configure AWS Credentials (Legacy)
        if: ${{ inputs.auth_method == 'legacy' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
          
      - name: ✅ Verify Authentication
        id: auth
        run: |
          echo "🔐 Testing AWS connection..."
          if aws sts get-caller-identity; then
            echo "✅ AWS authentication successful"
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "❌ AWS authentication failed"
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  parse-inputs:
    name: 🔍 Parse Deployment Configuration
    needs: auth-setup
    runs-on: ubuntu-latest
    outputs:
      deploy_vpc: ${{ steps.parse.outputs.deploy_vpc }}
      deploy_registry: ${{ steps.parse.outputs.deploy_registry }}
      deploy_storage: ${{ steps.parse.outputs.deploy_storage }}
      deploy_loadbalancer: ${{ steps.parse.outputs.deploy_loadbalancer }}
      deploy_backend: ${{ steps.parse.outputs.deploy_backend }}
      deploy_frontend_a: ${{ steps.parse.outputs.deploy_frontend_a }}
      deploy_frontend_b: ${{ steps.parse.outputs.deploy_frontend_b }}
      deploy_feature_flags: ${{ steps.parse.outputs.deploy_feature_flags }}
    steps:
      - name: Parse inputs
        id: parse
        run: |
          # Parse infrastructure: vpc,registry,storage,lb
          IFS=',' read -ra INFRA <<< "${{ inputs.infrastructure }}"
          echo "deploy_vpc=${INFRA[0]}" >> $GITHUB_OUTPUT
          echo "deploy_registry=${INFRA[1]}" >> $GITHUB_OUTPUT
          echo "deploy_storage=${INFRA[2]}" >> $GITHUB_OUTPUT
          echo "deploy_loadbalancer=${INFRA[3]}" >> $GITHUB_OUTPUT
          
          # Parse applications: backend,frontend-a,frontend-b,feature-flags
          IFS=',' read -ra APPS <<< "${{ inputs.applications }}"
          echo "deploy_backend=${APPS[0]}" >> $GITHUB_OUTPUT
          echo "deploy_frontend_a=${APPS[1]}" >> $GITHUB_OUTPUT
          echo "deploy_frontend_b=${APPS[2]}" >> $GITHUB_OUTPUT
          echo "deploy_feature_flags=${APPS[3]}" >> $GITHUB_OUTPUT

  infrastructure:
    name: 🏗️ Deploy Infrastructure
    needs: parse-inputs
    if: needs.parse-inputs.outputs.deploy_vpc == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/infrastructure.yml@trunk
    with:
      environment: ${{ inputs.environment }}
      action: apply
      project_name: ${{ inputs.project_name }}
    secrets: inherit
    
  backend:
    name: 🚀 Deploy Backend
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_backend == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: billpay-backend
      service_type: backend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-back
    secrets: inherit
    
  frontend-a:
    name: 🎨 Deploy Frontend A
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_frontend_a == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: frontend-a
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-a
    secrets: inherit
    
  frontend-b:
    name: 🎨 Deploy Frontend B
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_frontend_b == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: frontend-b
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-b
    secrets: inherit
    
  feature-flags:
    name: 🎨 Deploy Feature Flags
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_feature_flags == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: feature-flags
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-feature-flags
    secrets: inherit
