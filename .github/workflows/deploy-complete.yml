name: 🚀 Complete Project Deploy

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud Provider'
        required: true
        type: choice
        options: ['aws', 'gcp', 'azure', 'oci']
        default: 'aws'
      region:
        description: 'Region'
        required: true
        type: string
        default: 'us-east-1'
      environment:
        description: 'Environment'
        required: true
        type: choice
        options: ['dev', 'staging', 'prod', 'demo']
        default: 'demo'
      project_name:
        description: 'Project Name'
        required: true
        type: string
        default: 'billpay'
      auth_method:
        description: 'Authentication Method'
        required: false
        type: choice
        options: ['oidc', 'legacy']
        default: 'oidc'
      deploy_vpc:
        description: 'Deploy VPC'
        required: false
        type: boolean
        default: true
      deploy_registry:
        description: 'Deploy Container Registry'
        required: false
        type: boolean
        default: true
      deploy_storage:
        description: 'Deploy Storage (S3/Cloud Storage)'
        required: false
        type: boolean
        default: true
      deploy_loadbalancer:
        description: 'Deploy Load Balancer'
        required: false
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy Backend'
        required: false
        type: boolean
        default: false
      deploy_frontend_a:
        description: 'Deploy Frontend A'
        required: false
        type: boolean
        default: true
      deploy_frontend_b:
        description: 'Deploy Frontend B'
        required: false
        type: boolean
        default: false
      deploy_feature_flags:
        description: 'Deploy Feature Flags'
        required: false
        type: boolean
        default: false
      kubernetes_type:
        description: 'Kubernetes Type'
        required: false
        type: choice
        options: ['eks', 'gke', 'aks', 'oke']
        default: 'eks'
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      project_name:
        required: true
        type: string
        default: 'billpay'
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  auth-setup:
    name: 🔐 Setup Authentication
    runs-on: ubuntu-latest
    outputs:
      auth_configured: ${{ steps.auth.outputs.configured }}
    steps:
      - name: 🔐 Configure AWS Credentials (OIDC)
        if: ${{ inputs.auth_method == 'oidc' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: BillPayCompleteStack
          aws-region: ${{ inputs.region }}
          
      - name: 🔑 Configure AWS Credentials (Legacy)
        if: ${{ inputs.auth_method == 'legacy' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
          
      - name: ✅ Verify Authentication
        id: auth
        run: |
          echo "🔐 Testing AWS connection..."
          if aws sts get-caller-identity; then
            echo "✅ AWS authentication successful"
            echo "configured=true" >> $GITHUB_OUTPUT
          else
            echo "❌ AWS authentication failed"
            echo "configured=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  parse-inputs:
    name: 🔍 Parse Deployment Configuration
    needs: auth-setup
    runs-on: ubuntu-latest
    outputs:
      deploy_vpc: ${{ inputs.deploy_vpc }}
      deploy_registry: ${{ inputs.deploy_registry }}
      deploy_storage: ${{ inputs.deploy_storage }}
      deploy_loadbalancer: ${{ inputs.deploy_loadbalancer }}
      deploy_backend: ${{ inputs.deploy_backend }}
      deploy_frontend_a: ${{ inputs.deploy_frontend_a }}
      deploy_frontend_b: ${{ inputs.deploy_frontend_b }}
      deploy_feature_flags: ${{ inputs.deploy_feature_flags }}
    steps:
      - name: Parse inputs
        run: |
          echo "✅ Inputs parsed successfully"
          echo "VPC: ${{ inputs.deploy_vpc }}"
          echo "Registry: ${{ inputs.deploy_registry }}"
          echo "Storage: ${{ inputs.deploy_storage }}"

  infrastructure:
    name: 🏗️ Deploy Infrastructure
    needs: parse-inputs
    if: inputs.deploy_vpc == true
    uses: giovanemere/ia-ops-iac/.github/workflows/infrastructure.yml@trunk
    with:
      environment: ${{ inputs.environment }}
      action: apply
      project_name: ${{ inputs.project_name }}
    secrets: inherit
    
  backend:
    name: 🚀 Deploy Backend
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_backend == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: billpay-backend
      service_type: backend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-back
    secrets: inherit
    
  frontend-a:
    name: 🎨 Deploy Frontend A
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_frontend_a == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: frontend-a
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-a
    secrets: inherit
    
  frontend-b:
    name: 🎨 Deploy Frontend B
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_frontend_b == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: frontend-b
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-b
    secrets: inherit
    
  feature-flags:
    name: 🎨 Deploy Feature Flags
    needs: [parse-inputs, infrastructure]
    if: needs.parse-inputs.outputs.deploy_feature_flags == 'true'
    uses: giovanemere/ia-ops-iac/.github/workflows/deploy-service.yml@trunk
    with:
      service_name: feature-flags
      service_type: frontend
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      repository_name: poc-billpay-front-feature-flags
    secrets: inherit
