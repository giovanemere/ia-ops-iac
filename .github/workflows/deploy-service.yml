name: 🚀 Reusable Service Deploy

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      service_type:
        required: true
        type: string # backend, frontend
      environment:
        required: true
        type: string
      project_name:
        required: true
        type: string
      repository_name:
        required: true
        type: string
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true

env:
  AWS_REGION: us-east-1

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy ${{ inputs.service_name }}
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Service Repository
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/${{ inputs.repository_name }}
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: ⚙️ Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: BillPayServiceDeploy
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🔑 Login to Amazon ECR
      if: inputs.service_type == 'backend'
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      
    - name: 🐳 Build and Push Docker Image
      if: inputs.service_type == 'backend'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.project_name }}-${{ inputs.service_name }}
        IMAGE_TAG: ${{ inputs.environment }}-${{ github.sha }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV
        
    - name: 🔧 Setup Node.js
      if: inputs.service_type == 'frontend'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: 📦 Install Dependencies
      if: inputs.service_type == 'frontend'
      run: npm ci
      
    - name: 🏗️ Build Frontend
      if: inputs.service_type == 'frontend'
      run: npm run build
      
    - name: 📤 Deploy to S3
      if: inputs.service_type == 'frontend'
      run: |
        aws s3 sync dist/ s3://${{ inputs.project_name }}-${{ inputs.environment }}-${{ inputs.service_name }}/ --delete
        
    - name: 🔄 Invalidate CloudFront
      if: inputs.service_type == 'frontend'
      run: |
        DISTRIBUTION_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='${{ inputs.project_name }}-${{ inputs.environment }}-${{ inputs.service_name }}'].Id" --output text)
        if [ ! -z "$DISTRIBUTION_ID" ]; then
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/*"
        fi
        
    - name: 🚀 Deploy to EKS
      if: inputs.service_type == 'backend'
      run: |
        aws eks update-kubeconfig --region $AWS_REGION --name ${{ inputs.project_name }}-${{ inputs.environment }}-cluster
        
        # Update deployment with new image
        kubectl set image deployment/${{ inputs.service_name }} \
          ${{ inputs.service_name }}=${{ env.IMAGE_URI }} \
          -n ${{ inputs.project_name }}-${{ inputs.environment }}
          
        # Wait for rollout
        kubectl rollout status deployment/${{ inputs.service_name }} \
          -n ${{ inputs.project_name }}-${{ inputs.environment }} \
          --timeout=300s
