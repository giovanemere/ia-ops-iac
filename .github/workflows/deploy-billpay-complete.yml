name: Deploy BillPay Complete Stack

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Target project name'
        required: true
        type: string
      environment:
        description: 'Environment (dev/staging/prod)'
        required: true
        type: choice
        options: [dev, staging, prod]
      deployment_type:
        description: 'Deployment type'
        required: true
        type: choice
        options: [simulation, real-aws-oidc, real-aws-legacy]
      cloud_provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options: [aws, gcp, azure, oci]
      region:
        description: 'Cloud region'
        required: true
        type: string
      billpay_applications:
        description: 'BillPay apps to deploy (comma-separated booleans)'
        required: true
        type: string
        # Format: backend_api,payment_service,user_service,admin_service,frontend_payment,frontend_admin,feature_flags
      infrastructure_components:
        description: 'Infrastructure components (comma-separated)'
        required: true
        type: string
        # Format: vpc,kubernetes_type,container_registry,object_storage,load_balancer,secrets_manager,monitoring
      target_repository:
        description: 'Target repository name'
        required: true
        type: string

env:
  AWS_REGION: ${{ inputs.region }}
  PROJECT_NAME: ${{ inputs.project_name }}
  ENVIRONMENT: ${{ inputs.environment }}
  CLOUD_PROVIDER: ${{ inputs.cloud_provider }}

permissions:
  id-token: write
  contents: read

jobs:
  validate-inputs:
    runs-on: ubuntu-latest
    outputs:
      apps_config: ${{ steps.parse.outputs.apps_config }}
      infra_config: ${{ steps.parse.outputs.infra_config }}
      deploy_infra: ${{ steps.parse.outputs.deploy_infra }}
    steps:
      - name: Parse BillPay Applications
        id: parse
        run: |
          # Parse applications string
          IFS=',' read -ra APPS <<< "${{ inputs.billpay_applications }}"
          echo "apps_config=backend_api:${APPS[0]},payment_service:${APPS[1]},user_service:${APPS[2]},admin_service:${APPS[3]},frontend_payment:${APPS[4]},frontend_admin:${APPS[5]},feature_flags:${APPS[6]}" >> $GITHUB_OUTPUT
          
          # Parse infrastructure string
          IFS=',' read -ra INFRA <<< "${{ inputs.infrastructure_components }}"
          echo "infra_config=vpc:${INFRA[0]},kubernetes:${INFRA[1]},container_registry:${INFRA[2]},object_storage:${INFRA[3]},load_balancer:${INFRA[4]},secrets_manager:${INFRA[5]},monitoring:${INFRA[6]}" >> $GITHUB_OUTPUT
          
          # Check if infrastructure deployment is needed
          if [[ "${INFRA[0]}" == "true" || "${INFRA[1]}" != "false" || "${INFRA[2]}" == "true" ]]; then
            echo "deploy_infra=true" >> $GITHUB_OUTPUT
          else
            echo "deploy_infra=false" >> $GITHUB_OUTPUT
          fi

  deploy-infrastructure:
    needs: validate-inputs
    if: needs.validate-inputs.outputs.deploy_infra == 'true' && inputs.deployment_type != 'simulation'
    uses: ./.github/workflows/deploy-infrastructure-reusable.yml
    with:
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      cloud_provider: ${{ inputs.cloud_provider }}
      region: ${{ inputs.region }}
      auth_method: oidc
      deployment_type: ${{ inputs.deployment_type }}
      infrastructure_components: ${{ inputs.infrastructure_components }}
    secrets: inherit

  deploy-applications:
    needs: [validate-inputs, deploy-infrastructure]
    if: always() && (needs.deploy-infrastructure.result == 'success' || needs.deploy-infrastructure.result == 'skipped')
    uses: ./.github/workflows/deploy-applications-reusable.yml
    with:
      environment: ${{ inputs.environment }}
      project_name: ${{ inputs.project_name }}
      cluster_endpoint: ${{ needs.deploy-infrastructure.outputs.cluster_endpoint || 'simulation-cluster' }}
      deployment_type: ${{ inputs.deployment_type }}
      backend_repo: ${{ inputs.target_repository }}
      frontend_repos: "poc-billpay-front-a,poc-billpay-front-b,poc-billpay-front-feature-flags"
    secrets: inherit

  simulation:
    if: inputs.deployment_type == 'simulation'
    runs-on: ubuntu-latest
    steps:
      - name: 🎭 BillPay Complete Stack Simulation
        run: |
          echo "🎭 SIMULATION MODE - BillPay Complete Stack"
          echo "=========================================="
          echo "📦 Project: ${{ inputs.project_name }}"
          echo "🌍 Environment: ${{ inputs.environment }}"
          echo "☁️ Cloud: ${{ inputs.cloud_provider }}"
          echo "🌐 Region: ${{ inputs.region }}"
          echo ""
          
          # Parse and show applications
          IFS=',' read -ra APPS <<< "${{ inputs.billpay_applications }}"
          echo "🚀 BillPay Applications:"
          [[ "${APPS[0]}" == "true" ]] && echo "  ✅ Backend API (Java/Spring Boot)"
          [[ "${APPS[1]}" == "true" ]] && echo "  ✅ Payment Service (Core payments)"
          [[ "${APPS[2]}" == "true" ]] && echo "  ✅ User Service (Authentication)"
          [[ "${APPS[3]}" == "true" ]] && echo "  ✅ Admin Service (Management)"
          [[ "${APPS[4]}" == "true" ]] && echo "  ✅ Frontend Payment (Angular 17)"
          [[ "${APPS[5]}" == "true" ]] && echo "  ✅ Frontend Admin (Angular 17)"
          [[ "${APPS[6]}" == "true" ]] && echo "  ✅ Feature Flags (A/B Testing)"
          echo ""
          
          # Parse and show infrastructure
          IFS=',' read -ra INFRA <<< "${{ inputs.infrastructure_components }}"
          echo "🏗️ Infrastructure Components:"
          [[ "${INFRA[0]}" == "true" ]] && echo "  ✅ VPC Network (10.0.0.0/16)"
          [[ "${INFRA[1]}" != "false" ]] && echo "  ✅ Kubernetes (${INFRA[1]})"
          [[ "${INFRA[2]}" == "true" ]] && echo "  ✅ Container Registry"
          [[ "${INFRA[3]}" == "true" ]] && echo "  ✅ Object Storage + CDN"
          [[ "${INFRA[4]}" == "true" ]] && echo "  ✅ Load Balancer"
          [[ "${INFRA[5]}" == "true" ]] && echo "  ✅ Secrets Manager"
          [[ "${INFRA[6]}" == "true" ]] && echo "  ✅ Monitoring Stack"
          echo ""
          
          echo "⏱️ Simulating deployment phases..."
          echo "🏗️ Phase 1: Infrastructure setup..." && sleep 3
          echo "🐳 Phase 2: Container builds..." && sleep 2
          echo "☸️ Phase 3: Kubernetes deployments..." && sleep 3
          echo "🌐 Phase 4: Frontend deployments..." && sleep 2
          echo "🔗 Phase 5: Service integration..." && sleep 2
          echo ""
          echo "🎉 BillPay Complete Stack simulation completed!"
          echo "💰 Estimated real costs: $300-450/month"
          echo "⏱️ Real deployment time: 25-35 minutes"

  summary:
    needs: [validate-inputs, deploy-infrastructure, deploy-applications, simulation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Deployment Summary
        run: |
          echo "## 🏦 BillPay Complete Stack Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Project:** ${{ inputs.project_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cloud Provider:** ${{ inputs.cloud_provider }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ inputs.region }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployment Type:** ${{ inputs.deployment_type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ inputs.deployment_type }}" == "simulation" ]; then
            echo "### 🎭 Simulation Results:" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** ✅ Completed successfully" >> $GITHUB_STEP_SUMMARY
            echo "- **Duration:** ~30 seconds" >> $GITHUB_STEP_SUMMARY
            echo "- **Cost:** $0 (simulation)" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ☁️ Real Deployment Results:" >> $GITHUB_STEP_SUMMARY
            echo "- **Infrastructure:** ${{ needs.deploy-infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Applications:** ${{ needs.deploy-applications.result }}" >> $GITHUB_STEP_SUMMARY
            echo "- **Duration:** 25-35 minutes" >> $GITHUB_STEP_SUMMARY
            echo "- **Cost:** $300-450/month" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Access Links:" >> $GITHUB_STEP_SUMMARY
          echo "- [Target Repository](https://github.com/giovanemere/${{ inputs.target_repository }})" >> $GITHUB_STEP_SUMMARY
          echo "- [AWS Console](https://console.aws.amazon.com/)" >> $GITHUB_STEP_SUMMARY
