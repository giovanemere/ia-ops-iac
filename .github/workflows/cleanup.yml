name: 🧹 Cleanup Resources

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Project Name to cleanup'
        required: true
        type: string
        default: 'billpay-test'
      environment:
        description: 'Environment to cleanup'
        required: true
        type: string
        default: 'demo'
      confirm:
        description: 'Type DELETE to confirm'
        required: true
        type: string

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: ${{ inputs.project_name }}
  ENVIRONMENT: ${{ inputs.environment }}

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: 🧹 Cleanup BillPay Resources
    runs-on: ubuntu-latest
    
    steps:
    - name: 🔍 Validate Confirmation
      run: |
        if [ "${{ inputs.confirm }}" != "DELETE" ]; then
          echo "❌ Confirmation failed. Type 'DELETE' to confirm cleanup."
          exit 1
        fi
        echo "✅ Cleanup confirmed"
        
    - name: ⚙️ Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        role-session-name: BillPayCleanup
        aws-region: ${{ env.AWS_REGION }}
        
    - name: 🗑️ Remove S3 Bucket
      run: |
        BUCKET_NAME="${{ env.PROJECT_NAME }}-${{ env.ENVIRONMENT }}-frontend-a"
        echo "🗑️ Removing S3 bucket: $BUCKET_NAME"
        
        if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
          echo "📦 Bucket exists, removing contents and bucket..."
          aws s3 rm s3://$BUCKET_NAME --recursive
          aws s3 rb s3://$BUCKET_NAME
          echo "✅ Bucket removed: $BUCKET_NAME"
        else
          echo "ℹ️  Bucket does not exist: $BUCKET_NAME"
        fi
        
    - name: 📊 Cleanup Summary
      run: |
        echo ""
        echo "🎉 Cleanup Completed!"
        echo "===================="
        echo "✅ Project: ${{ env.PROJECT_NAME }}"
        echo "✅ Environment: ${{ env.ENVIRONMENT }}"
        echo "✅ S3 Bucket removed"
        echo "⏰ Completed at: $(date)"
